<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Notes - Vidya First Grade College</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        header {
            background: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        header h1 {
            color: #1d3557;
            font-size: 25px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            color: #1d3557;
        }

        .back-btn {
            text-decoration: none;
            background: #1d3557;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .note-card h3 {
            color: #1d3557;
            margin-bottom: 15px;
        }

        .note-card p {
            margin: 8px 0;
            color: #555;
        }

        .view-btn {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #146c43;
        }

        .no-notes {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #666;
        }

        footer {
            margin-top: 50px;
            background: #1d3557;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <img src="../images/college-logo.jpg" alt="College Logo">
    <h1>Vidya First Grade College</h1>
</header>

<div class="container">

    <div class="top">
        <h2>Access Notes</h2>
        <a href="dashboard.html" class="back-btn">Back</a>
    </div>

    <div id="notesContainer" class="notes-container"></div>

</div>

<footer>
    © 2026 Vidya First Grade College
</footer>

<script>

function loadApprovedNotes() {

    const container = document.getElementById("notesContainer");

    let approvedNotes = JSON.parse(
        localStorage.getItem("approvedNotes") || "[]"
    );

    container.innerHTML = "";

    if (approvedNotes.length === 0) {

        container.innerHTML = `
            <div class="no-notes">
                <h3>No Approved Notes Available</h3>
                <p>Admin has not approved any notes yet.</p>
            </div>
        `;

        return;
    }

    approvedNotes.forEach((note, index) => {

        const card = document.createElement("div");

        card.className = "note-card";

        card.innerHTML = `
            <h3>${escapeHTML(note.title || "Study Notes")}</h3>

            <p>
                <strong>Semester:</strong>
                ${escapeHTML(note.semester || "Not specified")}
            </p>

            <p>
                <strong>Subject:</strong>
                ${escapeHTML(note.subject || "Not specified")}
            </p>

            <p>
                <strong>File:</strong>
                ${escapeHTML(note.fileName || "PDF")}
            </p>

            <button class="view-btn" onclick="viewExactNote(${index})">
                View Exact Notes
            </button>
        `;

        container.appendChild(card);
    });
}


function viewExactNote(index) {

    const approvedNotes = JSON.parse(
        localStorage.getItem("approvedNotes") || "[]"
    );

    const note = approvedNotes[index];

    if (!note) {
        alert("Note not found.");
        return;
    }

    /*
       IMPORTANT:
       fileData contains the actual uploaded PDF.
    */

    if (!note.fileData) {

        alert(
            "The actual PDF data is not available for this note. " +
            "Please upload the PDF again and get it approved."
        );

        return;
    }

    try {

        /*
           Convert the saved PDF Data URL
           into an actual PDF Blob.
        */

        const parts = note.fileData.split(",");

        const mimeType =
            note.fileType || "application/pdf";

        const byteString = atob(parts[1]);

        const byteArray = new Uint8Array(byteString.length);

        for (let i = 0; i < byteString.length; i++) {
            byteArray[i] = byteString.charCodeAt(i);
        }

        const pdfBlob = new Blob(
            [byteArray],
            { type: mimeType }
        );

        const pdfURL = URL.createObjectURL(pdfBlob);

        /*
           Open the EXACT uploaded PDF.
        */

        window.open(pdfURL, "_blank");

    } catch (error) {

        console.error(error);

        alert("Unable to open the uploaded PDF.");
    }
}


function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


loadApprovedNotes();

</script>

</body>
</html>
