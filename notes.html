<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Notes | NoteHub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    color: #1e293b;
}

header {
    background: linear-gradient(135deg, #0756b8, #1688e8);
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand img {
    width: 55px;
    height: 55px;
    background: white;
    border-radius: 50%;
    padding: 4px;
    object-fit: contain;
}

.brand h1 {
    font-size: 26px;
}

.brand p {
    font-size: 13px;
    margin-top: 4px;
}

.back {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 10px 15px;
    border-radius: 8px;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 40px auto;
}

h2 {
    color: #0756b8;
    margin-bottom: 8px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
}

.note-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.note-info h3 {
    color: #124b91;
    margin-bottom: 7px;
}

.note-info p {
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
}

.view-button {
    border: none;
    background: #1769d1;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.view-button:hover {
    background: #0756b8;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    background: #dcfce7;
    color: #166534;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
    color: #64748b;
}

.popup {
    position: fixed;
    top: 25px;
    right: 25px;
    background: white;
    padding: 18px 20px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    border-left: 5px solid #1769d1;

    opacity: 0;
    transform: translateX(120%);
    transition: 0.4s;

    z-index: 9999;
}

.popup.show {
    opacity: 1;
    transform: translateX(0);
}

.popup strong {
    color: #0756b8;
}

.popup p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    background: #0b1f3a;
    color: white;
}

footer p {
    font-size: 13px;
    margin: 5px;
}

@media (max-width: 650px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    .note-card {
        flex-direction: column;
        align-items: stretch;
    }

    .view-button {
        width: 100%;
    }

    .popup {
        left: 20px;
        right: 20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">

        <img src="../college-logo.jpg" alt="College Logo">

        <div>
            <h1>NoteHub</h1>
            <p>Student Notes Portal</p>
        </div>

    </div>

    <a href="notes.html" class="back">
        ← Back
    </a>

</header>


<main class="container">

    <h2>📚 Access Notes</h2>

    <p class="subtitle">
        Approved notes are available below.
    </p>

    <div id="notesContainer"></div>

</main>


<div id="popup" class="popup">

    <strong>NoteHub</strong>

    <p id="popupMessage">
        Opening note...
    </p>

</div>


<footer>

    <p>
        © 2026 NoteHub — BCA Note Sharing System
    </p>

</footer>


<script>

function showPopup(message) {

    document.getElementById("popupMessage")
        .textContent = message;

    document.getElementById("popup")
        .classList.add("show");

    setTimeout(function() {

        document.getElementById("popup")
            .classList.remove("show");

    }, 2000);
}


function loadApprovedNote() {

    const container =
        document.getElementById("notesContainer");

    const savedNote =
        localStorage.getItem("noteHubApprovedNote");


    if (!savedNote) {

        container.innerHTML = `
            <div class="empty">

                <h3>No Approved Notes</h3>

                <p>
                    No notes have been approved by the admin yet.
                </p>

            </div>
        `;

        return;
    }


    const note =
        JSON.parse(savedNote);


    container.innerHTML = `

        <div class="note-card">

            <div class="note-info">

                <h3>
                    📄 ${note.title}
                </h3>

                <p>
                    <strong>Semester:</strong>
                    ${note.semester}
                    <br>

                    <strong>Subject:</strong>
                    ${note.subject}
                    <br>

                    <strong>File:</strong>
                    ${note.fileName}
                </p>

                <span class="status">
                    Approved
                </span>

            </div>


            <button
                class="view-button"
                onclick="viewNote()">

                View Notes

            </button>

        </div>

    `;
}


function viewNote() {

    const savedNote =
        localStorage.getItem("noteHubApprovedNote");


    if (!savedNote) {

        showPopup("No approved note found.");

        return;
    }


    const note =
        JSON.parse(savedNote);


    /*
       IMPORTANT:
       The current upload system saves the
       file information, but not the actual
       PDF file itself.

       Therefore this button currently shows
       the approved file information.
    */

    showPopup(
        "Approved: " + note.fileName
    );

}


loadApprovedNote();

</script>

</body>
</html>
