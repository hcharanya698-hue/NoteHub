<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Notes | Vidya First Grade College</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    color: #1e293b;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #063b82, #0878d1);
    color: white;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.college-brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.college-logo {
    width: 70px;
    height: 70px;
    background: white;
    border-radius: 50%;
    padding: 5px;
    object-fit: contain;
}

.college-name h1 {
    font-size: 23px;
    margin-bottom: 5px;
}

.college-name p {
    font-size: 13px;
}

.back-btn {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 10px 17px;
    border-radius: 8px;
    font-weight: bold;
}

.back-btn:hover {
    background: rgba(255,255,255,0.15);
}

/* MAIN */
.container {
    width: 92%;
    max-width: 1100px;
    margin: 40px auto;
}

.heading {
    text-align: center;
    margin-bottom: 30px;
}

.heading h2 {
    color: #063b82;
    font-size: 30px;
    margin-bottom: 8px;
}

.heading p {
    color: #64748b;
}

/* NOTE CARD */
.note-card {
    background: white;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border: 1px solid #e2e8f0;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.note-info h3 {
    color: #0756b8;
    margin-bottom: 8px;
}

.note-info p {
    color: #64748b;
    line-height: 1.7;
    font-size: 14px;
}

.approved {
    display: inline-block;
    margin-top: 8px;
    background: #dcfce7;
    color: #166534;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

/* VIEW BUTTON */
.view-btn {
    border: none;
    background: #0756b8;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.view-btn:hover {
    background: #043b82;
}

/* NO NOTES */
.no-notes {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
    color: #64748b;
}

/* POPUP */
.popup {
    position: fixed;
    top: 25px;
    right: 25px;
    width: 320px;
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    border-left: 5px solid #0756b8;

    opacity: 0;
    transform: translateX(120%);
    transition: 0.4s;
    z-index: 9999;
}

.popup.show {
    opacity: 1;
    transform: translateX(0);
}

.popup h3 {
    color: #0756b8;
    margin-bottom: 6px;
}

.popup p {
    color: #64748b;
    font-size: 13px;
    line-height: 1.5;
}

/* FOOTER */
footer {
    margin-top: 50px;
    background: #062b55;
    color: white;
    text-align: center;
    padding: 25px;
}

footer p {
    margin: 5px;
    font-size: 13px;
}

/* MOBILE */
@media (max-width: 700px) {

    header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

    .college-brand {
        flex-direction: column;
    }

    .note-card {
        flex-direction: column;
        align-items: stretch;
    }

    .view-btn {
        width: 100%;
    }

    .popup {
        left: 20px;
        right: 20px;
        width: auto;
    }
}
</style>
</head>

<body>

<!-- COLLEGE HEADER -->

<header>

    <div class="college-brand">

        <!-- COLLEGE LOGO -->
        <img
            id="collegeLogo"
            class="college-logo"
            src="images/college-logo.jpg"
            alt="Vidya First Grade College Logo"
        >
        <div class="college-name">

            <h1>
                Vidya First Grade College
            </h1>

            <p>
                Tumkur, Karnataka
            </p>

        </div>

    </div>

    <a
        href="../student/dashboard.html"
        class="back-btn"
    >
        ← Back
    </a>

</header>


<!-- MAIN CONTENT -->

<main class="container">

    <div class="heading">

        <h2>📚 Access Notes</h2>

        <p>
            Access college notes approved by the administrator.
        </p>

    </div>


    <div id="notesContainer"></div>

</main>


<!-- POPUP -->

<div id="popup" class="popup">

    <h3 id="popupTitle">
        Vidya First Grade College
    </h3>

    <p id="popupMessage">
        Message
    </p>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Vidya First Grade College, Tumkur
    </p>

    <p>
        BCA Notes Sharing and Management System
    </p>

</footer>


<script>

/* --------------------------------
   COLLEGE LOGO FALLBACK
-------------------------------- */

const logo = document.getElementById("collegeLogo");

logo.onerror = function() {

    /*
       If college-logo.jpg is not the
       exact filename, try this filename.
    */

    if (!this.dataset.secondTry) {

        this.dataset.secondTry = "yes";

        this.src = "../assets/college-logo-circle.jpg";

    } else {

        /*
           Keep the image area hidden only
           if neither logo file exists.
        */

        this.style.display = "none";
    }
};


/* --------------------------------
   POPUP
-------------------------------- */

function showPopup(title, message) {

    document.getElementById("popupTitle")
        .textContent = title;

    document.getElementById("popupMessage")
        .textContent = message;

    document.getElementById("popup")
        .classList.add("show");

    setTimeout(function() {

        document.getElementById("popup")
            .classList.remove("show");

    }, 2500);
}


/* --------------------------------
   LOAD APPROVED NOTE
-------------------------------- */

function loadApprovedNote() {

    const container =
        document.getElementById("notesContainer");

    const savedNote =
        localStorage.getItem("noteHubApprovedNote");


    if (!savedNote) {

        container.innerHTML = `
            <div class="no-notes">

                <h3>No Approved Notes</h3>

                <p>
                    There are currently no notes approved
                    by the administrator.
                </p>

            </div>
        `;

        return;
    }


    const note = JSON.parse(savedNote);


    container.innerHTML = `

        <div class="note-card">

            <div class="note-info">

                <h3>
                    📄 ${note.title}
                </h3>

                <p>

                    <strong>Semester:</strong>
                    ${note.semester}

                    <br>

                    <strong>Subject:</strong>
                    ${note.subject}

                    <br>

                    <strong>File:</strong>
                    ${note.fileName}

                </p>

                <span class="approved">
                    ✓ Approved
                </span>

            </div>


            <button
                class="view-btn"
                onclick="viewNote()"
            >
                👁 View Notes
            </button>

        </div>
    `;
}


/* --------------------------------
   VIEW NOTE
-------------------------------- */

function viewNote() {

    const savedNote =
        localStorage.getItem("noteHubApprovedNote");


    if (!savedNote) {

        showPopup(
            "No Note Available",
            "No approved note is available."
        );

        return;
    }


    const note =
        JSON.parse(savedNote);


    showPopup(
        "Approved Note",
        "Opening: " + note.fileName
    );


    /*
       At this stage the browser stores
       the note information, but not the
       actual uploaded PDF file.

       Therefore we show the approved
       filename.

       Real PDF opening will be connected
       when we add proper file storage.
    */

    setTimeout(function() {

        alert(
            "Approved Note\n\n" +
            "Title: " + note.title +
            "\nSubject: " + note.subject +
            "\nFile: " + note.fileName +
            "\n\nThe actual PDF file storage will be connected next."
        );

    }, 500);
}


/* --------------------------------
   START
-------------------------------- */

loadApprovedNote();

</script>

</body>
</html>
