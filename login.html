<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | NoteHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">

    <div class="brand">

        <img src="college-logo.jpg"
             alt="Vidya First Grade College Logo">

        <div>
            <h1>NoteHub</h1>
            <p>Vidya First Grade College, Tumkur</p>
        </div>

    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="admin-login.html">Admin Login</a>
    </nav>

</header>


<main class="login-container">

    <div class="login-card">

        <div class="login-icon">
            🎓
        </div>

        <h2>Student Login</h2>

        <p>
            Login to access your BCA academic resources.
        </p>


        <form id="studentLoginForm">

            <label for="studentEmail">
                Email Address
            </label>

            <input
                type="email"
                id="studentEmail"
                name="email"
                placeholder="Enter email address"
                required
            >


            <label for="studentPassword">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="studentPassword"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()">
                    👁️
                </button>

            </div>


            <button
                type="button"
                class="login-button"
                onclick="studentLogin()">
                Student Login →
            </button>

        </form>


        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

</main>


<footer>

    <p>
        © 2026 NoteHub — Vidya First Grade College, Tumkur.
    </p>

    <p>
        BCA Note Sharing and Management System
    </p>

</footer>
<script>
function togglePassword() {
    const password = document.getElementById("studentPassword");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}

function studentLogin() {
    const email = document.getElementById("studentEmail").value.trim();
    const password = document.getElementById("studentPassword").value;

    if (email === "" || password === "") {
        alert("Please enter your email and password.");
        return;
    }

    window.location.href = "student-dashboard.html";
}
</script>
</body>
</html>
