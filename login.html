<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - NoteHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo-section">
        <img src="college-logo.jpg" alt="College Logo">

        <div>
            <h1>NoteHub</h1>
            <p>Vidya First Grade College, Tumkur</p>
        </div>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="../admin/login.html">Admin Login</a>
    </nav>
</header>

<main>

    <section class="hero">

        <h2>🎓 Student Login</h2>

        <p>
            Login to access, search and share your academic notes.
        </p>

        <form action="dashboard.html">
            <input type="email"
                   placeholder="Enter Email Address"
                   required>

            <br><br>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <br><br>

            <button type="submit" class="btn">
                Login
            </button>
        </form>

        <p>
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </section>

</main>

<footer>
    <p>© 2026 Vidya First Grade College, Tumkur</p>
</footer>

</body>
</html>
