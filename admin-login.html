<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NoteHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo-section">
        <img src="college-logo.jpg" alt="Vidya First Grade College Logo">

        <div>
            <h1>NoteHub</h1>
            <p>Vidya First Grade College, Tumkur</p>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Student Login</a>
    </nav>
</header>

<main class="login-page">

    <div class="login-box">

        <div class="login-icon">🔐</div>

        <h2>Admin Login</h2>

        <p class="login-subtitle">
            Administrator Access
        </p>

        <p class="login-description">
            Login to manage students, notes and academic resources.
        </p>

        <form action="dashboard.html">

            <label>Admin Username</label>

            <input
                type="text"
                placeholder="Enter admin username"
                required
            >

            <label>Admin Password</label>

            <input
                type="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit" class="login-button">
                Admin Login →
            </button>

        </form>

        <a href="index.html" class="home-link">
            ← Back to Home
        </a>

    </div>

</main>

<footer>
    <p>© 2026 Vidya First Grade College, Tumkur</p>
</footer>

</body>
</html>
