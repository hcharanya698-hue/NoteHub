<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Notes | Vidya First Grade College</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fc;
    color: #1e293b;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #0756b8, #1688e8);
    color: white;
    padding: 16px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    background: white;
    border-radius: 50%;
    padding: 4px;
}

.brand h1 {
    font-size: 24px;
}

.brand p {
    font-size: 13px;
    margin-top: 4px;
}

.back {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 9px 14px;
    border-radius: 7px;
}

/* MAIN */

.container {
    width: 92%;
    max-width: 1100px;
    margin: 35px auto;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h2 {
    color: #0756b8;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}

/* NOTES */

.notes-container {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(300px, 1fr)
    );
    gap: 20px;
}

.note-card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border-left: 5px solid #0756b8;
}

.note-card h3 {
    color: #0756b8;
    margin-bottom: 15px;
}

.info {
    margin: 8px 0;
    font-size: 14px;
    color: #475569;
}

.info strong {
    color: #1e293b;
}

/* STATUS */

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.approved {
    background: #d1fae5;
    color: #065f46;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
}

button {
    border: none;
    padding: 10px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.view-btn {
    background: #0756b8;
    color: white;
}

.accept-btn {
    background: #168a5a;
    color: white;
}

.reject-btn {
    background: #dc3545;
    color: white;
}

.remove-btn {
    background: #6b7280;
    color: white;
}

button:hover {
    opacity: 0.85;
}

/* EMPTY */

.empty {
    background: white;
    padding: 40px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.empty h3 {
    color: #0756b8;
    margin-bottom: 10px;
}

.empty p {
    color: #64748b;
}

/* POPUP */

.popup {
    position: fixed;
    top: 25px;
    right: 25px;
    min-width: 280px;
    background: white;
    padding: 17px 20px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    border-left: 5px solid #168a5a;
    opacity: 0;
    transform: translateX(120%);
    transition: 0.4s;
    z-index: 1000;
}

.popup.show {
    opacity: 1;
    transform: translateX(0);
}

.popup strong {
    color: #0756b8;
}

.popup p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

/* FOOTER */

footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    background: #0b1f3a;
    color: white;
}

footer p {
    font-size: 13px;
    margin: 5px;
}

/* MOBILE */

@media(max-width:700px) {

    header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .popup {
        left: 20px;
        right: 20px;
    }

}

</style>
</head>


<body>


<!-- COLLEGE HEADER -->

<header>

    <div class="brand">

        <img
            src="../images/college-logo.jpg"
            alt="Vidya First Grade College Logo"
        >

        <div>

            <h1>
                Vidya First Grade College
            </h1>

            <p>
                Tumkur, Karnataka
            </p>

        </div>

    </div>


    <a
        href="dashboard.html"
        class="back"
    >
        ← Admin Dashboard
    </a>

</header>


<!-- MAIN -->

<main class="container">

    <div class="title">

        <h2>
            Manage Notes
        </h2>

        <p>
            Review student notes before making them available
        </p>

    </div>


    <div
        id="notesContainer"
        class="notes-container"
    ></div>

</main>


<!-- POPUP -->

<div
    id="popup"
    class="popup"
>

    <strong id="popupTitle">
        Message
    </strong>

    <p id="popupMessage">
        Message
    </p>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Vidya First Grade College, Tumkur
    </p>

    <p>
        Academic Notes Sharing and Management System
    </p>

</footer>


<script>

/* =================================================
   GET ALL PENDING NOTES
================================================= */

function getPendingNotes() {

    let notes = [];


    try {

        const data =
            localStorage.getItem("pendingNotes");


        if (data) {

            const parsed =
                JSON.parse(data);


            if (Array.isArray(parsed)) {

                notes = parsed;

            }

        }

    } catch(error) {

        console.log(error);

    }


    /*
       Check the single pending note too.
    */

    try {

        const singleData =
            localStorage.getItem(
                "noteHubPendingNote"
            );


        if (singleData) {

            const singleNote =
                JSON.parse(singleData);


            if (singleNote) {

                const alreadyExists =
                    notes.some(function(note) {

                        return String(note.id) ===
                               String(singleNote.id);

                    });


                if (!alreadyExists) {

                    notes.push(singleNote);

                }

            }

        }

    } catch(error) {

        console.log(error);

    }


    return notes;

}


/* =================================================
   DISPLAY NOTES
================================================= */

function displayNotes() {

    const container =
        document.getElementById(
            "notesContainer"
        );


    const notes =
        getPendingNotes();


    container.innerHTML = "";


    if (notes.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    No Notes Available
                </h3>

                <p>
                    No student notes have been uploaded yet.
                </p>

            </div>

        `;

        return;

    }


    notes.forEach(function(note, index) {

        const status =
            String(
                note.status || "Pending"
            ).toLowerCase();


        let statusClass =
            "pending";


        let statusText =
            "Pending Approval";


        if (status === "approved") {

            statusClass =
                "approved";

            statusText =
                "Approved";

        }


        if (status === "rejected") {

            statusClass =
                "rejected";

            statusText =
                "Rejected";

        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "note-card";


        card.innerHTML = `

            <h3>
                📄 ${escapeHTML(
                    note.title ||
                    note.fileName ||
                    "Untitled Note"
                )}
            </h3>


            <div class="info">

                <strong>
                    Semester:
                </strong>

                ${escapeHTML(
                    note.semester ||
                    "Not specified"
                )}

            </div>


            <div class="info">

                <strong>
                    Subject:
                </strong>

                ${escapeHTML(
                    note.subject ||
                    "Not specified"
                )}

            </div>


            <div class="info">

                <strong>
                    File:
                </strong>

                ${escapeHTML(
                    note.fileName ||
                    "PDF file"
                )}

            </div>


            <div class="info">

                <strong>
                    Uploaded:
                </strong>

                ${escapeHTML(
                    note.uploadedDate ||
                    "Recently"
                )}

            </div>


            <span class="status ${statusClass}">

                ${statusText}

            </span>


            <div class="buttons">

                <button
                    class="view-btn"
                    onclick="viewPDF(${index})"
                >
                    👁 View PDF
                </button>


                ${
                    status !== "approved"
                    ?
                    `
                    <button
                        class="accept-btn"
                        onclick="acceptNote(${index})"
                    >
                        ✅ Accept
                    </button>

                    <button
                        class="reject-btn"
                        onclick="rejectNote(${index})"
                    >
                        ❌ Reject
                    </button>
                    `
                    :
                    ""
                }


                <button
                    class="remove-btn"
                    onclick="removeNote(${index})"
                >
                    🗑 Remove
                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =================================================
   VIEW PDF
================================================= */

function viewPDF(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        showPopup(
            "Error",
            "The selected note was not found."
        );

        return;

    }


    /*
       IMPORTANT:
       share-notes.html saves the PDF
       inside note.fileData.
    */

    const dataURL =
        note.fileData;


    if (!dataURL) {

        showPopup(
            "PDF Not Found",
            "The actual PDF was not saved with this note. Please upload the PDF again."
        );

        return;

    }


    try {

        /*
           Convert Data URL → Blob
        */

        const parts =
            dataURL.split(",");


        const mimeMatch =
            parts[0].match(
                /data:(.*?);base64/
            );


        if (
            !mimeMatch ||
            parts.length < 2
        ) {

            showPopup(
                "PDF Error",
                "The saved PDF data is invalid."
            );

            return;

        }


        const mimeType =
            mimeMatch[1];


        const binary =
            atob(parts[1]);


        const bytes =
            new Uint8Array(
                binary.length
            );


        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);

        }


        const blob =
            new Blob(
                [bytes],
                {
                    type: mimeType
                }
            );


        const pdfURL =
            URL.createObjectURL(blob);


        /*
           Open the actual PDF.
        */

        const newWindow =
            window.open(
                pdfURL,
                "_blank"
            );


        if (!newWindow) {

            showPopup(
                "Popup Blocked",
                "Please allow popups for this website and try again."
            );

            return;

        }


        /*
           Keep URL available for the PDF tab.
        */

        setTimeout(
            function() {

                URL.revokeObjectURL(
                    pdfURL
                );

            },
            120000
        );


    } catch(error) {

        console.error(
            "PDF ERROR:",
            error
        );


        showPopup(
            "Unable to Open PDF",
            "There was a problem opening the PDF."
        );

    }

}


/* =================================================
   ACCEPT NOTE
================================================= */

function acceptNote(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        return;

    }


    /*
       Keep PDF fileData.
    */

    note.status =
        "Approved";


    note.approvalStatus =
        "Approved";


    note.approved =
        true;


    /*
       Get existing approved notes.
    */

    let approvedNotes =
        [];


    try {

        const data =
            localStorage.getItem(
                "approvedNotes"
            );


        if (data) {

            const parsed =
                JSON.parse(data);


            if (Array.isArray(parsed)) {

                approvedNotes =
                    parsed;

            }

        }

    } catch(error) {

        console.log(error);

    }


    /*
       Prevent duplicate notes.
    */

    const existingIndex =
        approvedNotes.findIndex(
            function(existingNote) {

                return String(existingNote.id) ===
                       String(note.id);

            }
        );


    if (existingIndex >= 0) {

        approvedNotes[
            existingIndex
        ] = note;

    } else {

        approvedNotes.push(note);

    }


    /*
       Save approved note WITH PDF.
    */

    localStorage.setItem(
        "approvedNotes",
        JSON.stringify(
            approvedNotes
        )
    );


    /*
       Also keep a second approved copy.
    */

    localStorage.setItem(
        "adminApprovedNotes",
        JSON.stringify(
            approvedNotes
        )
    );


    /*
       Remove from pending.
    */

    removePendingNote(
        note.id
    );


    /*
       Remove single pending item.
    */

    try {

        const single =
            JSON.parse(
                localStorage.getItem(
                    "noteHubPendingNote"
                )
            );


        if (
            single &&
            String(single.id) ===
            String(note.id)
        ) {

            localStorage.removeItem(
                "noteHubPendingNote"
            );

        }

    } catch(error) {

        console.log(error);

    }


    showPopup(
        "Note Accepted",
        "The note has been approved successfully."
    );


    displayNotes();

}


/* =================================================
   REJECT NOTE
================================================= */

function rejectNote(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        return;

    }


    const confirmation =
        confirm(
            "Are you sure you want to reject this note?"
        );


    if (!confirmation) {

        return;

    }


    /*
       Remove from pending.
    */

    removePendingNote(
        note.id
    );


    /*
       Remove single pending item.
    */

    try {

        const single =
            JSON.parse(
                localStorage.getItem(
                    "noteHubPendingNote"
                )
            );


        if (
            single &&
            String(single.id) ===
            String(note.id)
        ) {

            localStorage.removeItem(
                "noteHubPendingNote"
            );

        }

    } catch(error) {

        console.log(error);

    }


    showPopup(
        "Note Rejected",
        "The note has been rejected."
    );


    displayNotes();

}


/* =================================================
   REMOVE NOTE
================================================= */

function removeNote(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        return;

    }


    const confirmation =
        confirm(
            "Are you sure you want to remove this note?"
        );


    if (!confirmation) {

        return;

    }


    removePendingNote(
        note.id
    );


    showPopup(
        "Note Removed",
        "The note has been removed."
    );


    displayNotes();

}


/* =================================================
   REMOVE PENDING NOTE
================================================= */

function removePendingNote(id) {

    try {

        let notes =
            JSON.parse(
                localStorage.getItem(
                    "pendingNotes"
                )
            ) || [];


        if (!Array.isArray(notes)) {

            notes = [];

        }


        notes =
            notes.filter(
                function(note) {

                    return String(note.id) !==
                           String(id);

                }
            );


        localStorage.setItem(
            "pendingNotes",
            JSON.stringify(
                notes
            )
        );

    } catch(error) {

        console.log(error);

    }

}


/* =================================================
   POPUP
================================================= */

function showPopup(
    title,
    message
) {

    document.getElementById(
        "popupTitle"
    ).textContent =
        title;


    document.getElementById(
        "popupMessage"
    ).textContent =
        message;


    document.getElementById(
        "popup"
    ).classList.add(
        "show"
    );


    setTimeout(
        function() {

            document.getElementById(
                "popup"
            ).classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =================================================
   ESCAPE HTML
================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =================================================
   LOAD NOTES
================================================= */

displayNotes();

</script>

</body>
</html>
