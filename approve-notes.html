<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    Approve Notes | Vidya First Grade College
</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    color: #1e293b;
}

/* HEADER */

header {
    background: linear-gradient(135deg, #0756b8, #1688e8);
    color: white;
    padding: 16px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    background: white;
    border-radius: 50%;
    padding: 4px;
}

.brand h1 {
    font-size: 24px;
}

.brand p {
    font-size: 13px;
    margin-top: 4px;
}

.back {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 10px 15px;
    border-radius: 8px;
}

/* MAIN */

.container {
    width: 92%;
    max-width: 1100px;
    margin: 35px auto;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h2 {
    color: #0756b8;
    margin-bottom: 8px;
}

.title p {
    color: #64748b;
}

/* NOTES */

.notes-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.note-card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

    border-left: 5px solid #0756b8;
}

.note-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.note-card h3 {
    color: #0756b8;
    margin-bottom: 15px;
    word-break: break-word;
}

.info {
    margin: 8px 0;
    font-size: 14px;
    color: #64748b;
}

.info strong {
    color: #1e293b;
}

/* STATUS */

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
}

button {
    border: none;
    padding: 10px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.view-btn {
    background: #0756b8;
    color: white;
}

.accept-btn {
    background: #168a5a;
    color: white;
}

.reject-btn {
    background: #dc3545;
    color: white;
}

button:hover {
    opacity: 0.85;
}

/* EMPTY */

.empty {
    background: white;
    padding: 45px;
    border-radius: 14px;
    text-align: center;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
}

.empty h3 {
    color: #0756b8;
    margin-bottom: 10px;
}

.empty p {
    color: #64748b;
}

/* POPUP */

.popup {
    position: fixed;
    top: 25px;
    right: 25px;

    min-width: 280px;

    background: white;

    padding: 17px 20px;

    border-radius: 12px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

    border-left: 5px solid #168a5a;

    opacity: 0;

    transform: translateX(120%);

    transition: 0.4s;

    z-index: 1000;
}

.popup.show {
    opacity: 1;
    transform: translateX(0);
}

.popup strong {
    color: #0756b8;
}

.popup p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

/* FOOTER */

footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    background: #0b1f3a;
    color: white;
}

footer p {
    font-size: 13px;
    margin: 5px;
}

/* MOBILE */

@media(max-width:700px) {

    header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .popup {
        left: 20px;
        right: 20px;
        min-width: auto;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="brand">

        <img
            src="../images/college-logo.jpg"
            alt="Vidya First Grade College Logo"
        >

        <div>

            <h1>
                Vidya First Grade College
            </h1>

            <p>
                Notes Approval Module
            </p>

        </div>

    </div>


    <a
        href="dashboard.html"
        class="back"
    >
        ← Admin Dashboard
    </a>

</header>


<!-- MAIN -->

<main class="container">

    <div class="title">

        <h2>
            📋 Approve Notes
        </h2>

        <p>
            Review student notes before accepting or rejecting them.
        </p>

    </div>


    <div
        id="notesGrid"
        class="notes-grid"
    ></div>

</main>


<!-- POPUP -->

<div
    id="popup"
    class="popup"
>

    <strong id="popupTitle">
        Message
    </strong>

    <p id="popupMessage">
        Message
    </p>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Vidya First Grade College, Tumkur
    </p>

    <p>
        Academic Notes Approval System
    </p>

</footer>


<script>

/* ==========================================
   GET PENDING NOTES
========================================== */

function getPendingNotes() {

    let notes = [];


    /* Get array of pending notes */

    try {

        const data =
            localStorage.getItem(
                "pendingNotes"
            );


        if (data) {

            const parsed =
                JSON.parse(data);


            if (Array.isArray(parsed)) {

                notes = parsed;

            }

        }

    } catch(error) {

        console.log(error);

    }


    /*
       Also check the single pending note
    */

    try {

        const singleData =
            localStorage.getItem(
                "noteHubPendingNote"
            );


        if (singleData) {

            const singleNote =
                JSON.parse(singleData);


            if (singleNote) {

                const exists =
                    notes.some(function(note) {

                        return String(note.id) ===
                               String(singleNote.id);

                    });


                if (!exists) {

                    notes.push(singleNote);

                }

            }

        }

    } catch(error) {

        console.log(error);

    }


    return notes;

}


/* ==========================================
   DISPLAY NOTES
========================================== */

function displayNotes() {

    const container =
        document.getElementById(
            "notesGrid"
        );


    const notes =
        getPendingNotes();


    container.innerHTML = "";


    if (notes.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    📚 No Notes Pending
                </h3>

                <p>
                    There are currently no notes waiting for approval.
                </p>

            </div>

        `;

        return;

    }


    notes.forEach(function(note, index) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "note-card";


        card.innerHTML = `

            <div class="note-icon">
                📄
            </div>


            <h3>
                ${escapeHTML(
                    note.title ||
                    "Untitled Note"
                )}
            </h3>


            <div class="info">

                <strong>
                    Subject:
                </strong>

                ${escapeHTML(
                    note.subject ||
                    "Not specified"
                )}

            </div>


            <div class="info">

                <strong>
                    Semester:
                </strong>

                ${escapeHTML(
                    note.semester ||
                    "Not specified"
                )}

            </div>


            <div class="info">

                <strong>
                    File:
                </strong>

                ${escapeHTML(
                    note.fileName ||
                    "No filename"
                )}

            </div>


            <div class="info">

                <strong>
                    Status:
                </strong>

                <span class="status pending">
                    Pending Approval
                </span>

            </div>


            <div class="buttons">

                <button
                    class="view-btn"
                    onclick="viewNote(${index})"
                >
                    👁 View
                </button>


                <button
                    class="accept-btn"
                    onclick="acceptNote(${index})"
                >
                    ✅ Accept
                </button>


                <button
                    class="reject-btn"
                    onclick="rejectNote(${index})"
                >
                    ❌ Reject
                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


/* ==========================================
   VIEW NOTE
========================================== */

function viewNote(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        showPopup(
            "Error",
            "The selected note could not be found."
        );

        return;

    }


    /*
       THIS IS THE IMPORTANT PART.

       The PDF must be stored in fileData
       by share-notes.html.
    */

    const fileData =
        note.fileData;


    if (!fileData) {

        showPopup(
            "PDF Not Available",
            "This note was uploaded without the actual PDF data. Please upload the PDF again."
        );

        return;

    }


    try {

        /*
           Example:

           data:application/pdf;base64,JVBER...
        */

        const commaIndex =
            fileData.indexOf(",");


        if (commaIndex === -1) {

            showPopup(
                "PDF Error",
                "The saved PDF data is invalid."
            );

            return;

        }


        const header =
            fileData.substring(
                0,
                commaIndex
            );


        const base64Data =
            fileData.substring(
                commaIndex + 1
            );


        /*
           Find MIME type.
        */

        const mimeMatch =
            header.match(
                /data:([^;]+)/
            );


        const mimeType =
            mimeMatch
            ? mimeMatch[1]
            : "application/pdf";


        /*
           Convert Base64 to binary.
        */

        const binary =
            atob(base64Data);


        const bytes =
            new Uint8Array(
                binary.length
            );


        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);

        }


        /*
           Create PDF Blob.
        */

        const blob =
            new Blob(
                [bytes],
                {
                    type: mimeType
                }
            );


        /*
           Create temporary PDF URL.
        */

        const pdfURL =
            URL.createObjectURL(
                blob
            );


        /*
           Open PDF in new tab.
        */

        const newWindow =
            window.open(
                pdfURL,
                "_blank"
            );


        if (!newWindow) {

            showPopup(
                "Popup Blocked",
                "Please allow popups for this website and try again."
            );

            return;

        }


        /*
           Give browser enough time
           to load the PDF.
        */

        setTimeout(function() {

            URL.revokeObjectURL(
                pdfURL
            );

        }, 120000);


    } catch(error) {

        console.error(
            "PDF OPEN ERROR:",
            error
        );


        showPopup(
            "Unable to Open PDF",
            "The PDF could not be opened."
        );

    }

}


/* ==========================================
   ACCEPT NOTE
========================================== */

function acceptNote(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        return;

    }


    /*
       Mark as approved.
       IMPORTANT:
       fileData is kept.
    */

    note.status =
        "Approved";

    note.approvalStatus =
        "Approved";

    note.approved =
        true;


    /*
       Get existing approved notes.
    */

    let approvedNotes = [];


    try {

        const data =
            localStorage.getItem(
                "approvedNotes"
            );


        if (data) {

            const parsed =
                JSON.parse(data);


            if (Array.isArray(parsed)) {

                approvedNotes =
                    parsed;

            }

        }

    } catch(error) {

        console.log(error);

    }


    /*
       Avoid duplicate notes.
    */

    const existingIndex =
        approvedNotes.findIndex(
            function(existing) {

                return String(existing.id) ===
                       String(note.id);

            }
        );


    if (existingIndex >= 0) {

        approvedNotes[
            existingIndex
        ] = note;

    } else {

        approvedNotes.push(note);

    }


    /*
       Save approved notes.
       fileData is included here.
    */

    localStorage.setItem(
        "approvedNotes",
        JSON.stringify(
            approvedNotes
        )
    );


    /*
       Also save backup collection.
    */

    localStorage.setItem(
        "adminApprovedNotes",
        JSON.stringify(
            approvedNotes
        )
    );


    /*
       Remove from pending.
    */

    removePendingNote(
        note.id
    );


    /*
       Remove single pending item
       if it is the same note.
    */

    try {

        const single =
            JSON.parse(
                localStorage.getItem(
                    "noteHubPendingNote"
                )
            );


        if (
            single &&
            String(single.id) ===
            String(note.id)
        ) {

            localStorage.removeItem(
                "noteHubPendingNote"
            );

        }

    } catch(error) {

        console.log(error);

    }


    showPopup(
        "Note Accepted",
        "The note has been approved successfully."
    );


    displayNotes();

}


/* ==========================================
   REJECT NOTE
========================================== */

function rejectNote(index) {

    const notes =
        getPendingNotes();


    const note =
        notes[index];


    if (!note) {

        return;

    }


    const confirmReject =
        confirm(
            "Are you sure you want to reject this note?"
        );


    if (!confirmReject) {

        return;

    }


    removePendingNote(
        note.id
    );


    /*
       Remove single pending note too.
    */

    try {

        const single =
            JSON.parse(
                localStorage.getItem(
                    "noteHubPendingNote"
                )
            );


        if (
            single &&
            String(single.id) ===
            String(note.id)
        ) {

            localStorage.removeItem(
                "noteHubPendingNote"
            );

        }

    } catch(error) {

        console.log(error);

    }


    showPopup(
        "Note Rejected",
        "The note has been rejected successfully."
    );


    displayNotes();

}


/* ==========================================
   REMOVE PENDING NOTE
========================================== */

function removePendingNote(id) {

    try {

        let notes =
            JSON.parse(
                localStorage.getItem(
                    "pendingNotes"
                )
            ) || [];


        if (!Array.isArray(notes)) {

            notes = [];

        }


        notes =
            notes.filter(
                function(note) {

                    return String(note.id) !==
                           String(id);

                }
            );


        localStorage.setItem(
            "pendingNotes",
            JSON.stringify(
                notes
            )
        );

    } catch(error) {

        console.log(error);

    }

}


/* ==========================================
   POPUP
========================================== */

function showPopup(
    title,
    message
) {

    document.getElementById(
        "popupTitle"
    ).textContent =
        title;


    document.getElementById(
        "popupMessage"
    ).textContent =
        message;


    document.getElementById(
        "popup"
    ).classList.add(
        "show"
    );


    setTimeout(function() {

        document.getElementById(
            "popup"
        ).classList.remove(
            "show"
        );

    }, 3000);

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* ==========================================
   START
========================================== */

displayNotes();

</script>

</body>

</html>
