<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approve Notes | NoteHub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    color: #1e293b;
}

header {
    background: linear-gradient(135deg, #0756b8, #1688e8);
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    background: white;
    border-radius: 50%;
    padding: 4px;
}

.brand h1 {
    font-size: 26px;
}

.brand p {
    font-size: 13px;
    margin-top: 4px;
}

.back {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 10px 15px;
    border-radius: 8px;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

h2 {
    color: #0756b8;
    margin-bottom: 8px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
}

.note-card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    border: 1px solid #e2e8f0;
}

.note-card h3 {
    color: #124b91;
    margin-bottom: 8px;
}

.note-card p {
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #fff3cd;
    color: #856404;
    font-size: 12px;
    font-weight: bold;
}

.buttons {
    margin-top: 18px;
    display: flex;
    gap: 10px;
}

button {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.view {
    background: #1769d1;
}

.approve {
    background: #168a5a;
}

.reject {
    background: #dc3545;
}

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
    color: #64748b;
}

.popup {
    position: fixed;
    top: 25px;
    right: 25px;
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    border-left: 5px solid #168a5a;
    opacity: 0;
    transform: translateX(120%);
    transition: 0.4s;
}

.popup.show {
    opacity: 1;
    transform: translateX(0);
}

.popup strong {
    color: #0756b8;
}

.popup p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    background: #0b1f3a;
    color: white;
}

footer p {
    margin: 5px;
    font-size: 13px;
}

@media (max-width: 650px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .popup {
        left: 20px;
        right: 20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">
        <img src="../college-logo.jpg" alt="College Logo">

        <div>
            <h1>NoteHub</h1>
            <p>Admin Control Panel</p>
        </div>
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<main class="container">

    <h2>✅ Approve Notes</h2>

    <p class="subtitle">
        Review notes submitted by students.
    </p>

    <div id="notesContainer"></div>

</main>


<div id="popup" class="popup">

    <strong id="popupTitle">
        NoteHub
    </strong>

    <p id="popupMessage">
        Note updated.
    </p>

</div>


<footer>

    <p>© 2026 NoteHub — BCA Note Sharing System</p>

</footer>


<script>

function showPopup(title, message) {

    document.getElementById("popupTitle").textContent = title;

    document.getElementById("popupMessage").textContent = message;

    document.getElementById("popup").classList.add("show");

    setTimeout(function() {

        document.getElementById("popup").classList.remove("show");

    }, 2200);
}


function loadPendingNote() {

    const container =
        document.getElementById("notesContainer");

    const savedNote =
        localStorage.getItem("noteHubPendingNote");

    if (!savedNote) {

        container.innerHTML = `
            <div class="empty">
                <h3>No Pending Notes</h3>
                <p>There are no notes waiting for approval.</p>
            </div>
        `;

        return;
    }


    const note = JSON.parse(savedNote);


    container.innerHTML = `

        <div class="note-card">

            <h3>📄 ${note.title}</h3>

            <p>
                <strong>Semester:</strong>
                ${note.semester}
                <br>

                <strong>Subject:</strong>
                ${note.subject}
                <br>

                <strong>File:</strong>
                ${note.fileName}
            </p>

            <span class="status">
                ${note.status}
            </span>

            <div class="buttons">

                <button
                    class="view"
                    onclick="viewNote()">
                    View
                </button>

                <button
                    class="approve"
                    onclick="approveNote()">
                    Approve
                </button>

                <button
                    class="reject"
                    onclick="rejectNote()">
                    Reject
                </button>

            </div>

        </div>
    `;
}


function viewNote() {

    showPopup(
        "Note Information",
        "File: " +
        JSON.parse(
            localStorage.getItem("noteHubPendingNote")
        ).fileName
    );
}


function approveNote() {

    const savedNote =
        localStorage.getItem("noteHubPendingNote");

    if (!savedNote) {
        return;
    }

    const note = JSON.parse(savedNote);

    note.status = "Approved";

    localStorage.setItem(
        "noteHubApprovedNote",
        JSON.stringify(note)
    );

    localStorage.removeItem(
        "noteHubPendingNote"
    );

    showPopup(
        "Approved",
        "The note has been approved successfully."
    );

    setTimeout(function() {
        loadPendingNote();
    }, 1000);
}


function rejectNote() {

    localStorage.removeItem(
        "noteHubPendingNote"
    );

    showPopup(
        "Rejected",
        "The note has been rejected."
    );

    setTimeout(function() {
        loadPendingNote();
    }, 1000);
}


loadPendingNote();

</script>

</body>
</html>
