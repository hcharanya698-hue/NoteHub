<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - NoteHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <div class="logo-section">
        <img src="college-logo.jpg" alt="College Logo">
        <div>
            <h1>NoteHub</h1>
            <p>Vidya First Grade College, Tumkur</p>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <h2>📝 Student Registration</h2>

        <form>
            <input type="text" placeholder="Full Name" required><br><br>

            <input type="email" placeholder="Email Address" required><br><br>

            <input type="text" placeholder="Student ID" required><br><br>

            <input type="password" placeholder="Password" required><br><br>

            <button type="submit" class="btn">Register</button>
        </form>

        <p>
            Already registered?
            <a href="login.html">Student Login</a>
        </p>
    </section>
</main>

<footer>
    <p>© 2026 Vidya First Grade College, Tumkur</p>
</footer>

</body>
</html>
