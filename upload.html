<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Notes - NoteHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <div class="logo-section">
        <img src="../images/college-logo.jpg" alt="College Logo">
        <div>
            <h1>NoteHub</h1>
            <p>Share Academic Notes</p>
        </div>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="../student/dashboard.html">Dashboard</a>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>Upload & Share Notes</h2>

        <form>

            <input type="text"
                   placeholder="Note Title"
                   required><br><br>

            <input type="text"
                   placeholder="Subject"
                   required><br><br>

            <input type="text"
                   placeholder="Semester"
                   required><br><br>

            <textarea
                placeholder="Description"
                rows="5"
                required></textarea><br><br>

            <input type="file"
                   accept=".pdf,.doc,.docx"
                   required><br><br>

            <button type="submit" class="btn">
                Upload Notes
            </button>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Vidya First Grade College, Tumkur</p>
</footer>

</body>
</html>
