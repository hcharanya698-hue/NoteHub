<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Share Notes | Vidya First Grade College</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #1e293b;
        }

        /* COLLEGE HEADER */
        header {
            background: linear-gradient(135deg, #0756b8, #1688e8);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 4px;
        }

        .brand h1 {
            font-size: 25px;
        }

        .brand p {
            font-size: 13px;
            margin-top: 5px;
        }

        .back {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .back:hover {
            background: white;
            color: #0756b8;
        }

        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        /* CARD */
        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #0756b8;
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            margin-bottom: 25px;
        }

        /* FORM */
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1688e8;
        }

        /* UPLOAD BUTTON */
        .upload-button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #0756b8, #1688e8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-button:hover {
            opacity: 0.9;
        }

        .file-name {
            margin-top: 8px;
            font-size: 13px;
            color: #64748b;
        }

        /* POPUP */
        .popup {
            position: fixed;
            top: 25px;
            right: 25px;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
            border-left: 5px solid #168a5a;

            opacity: 0;
            transform: translateX(120%);
            transition: 0.4s;

            z-index: 1000;
        }

        .popup.show {
            opacity: 1;
            transform: translateX(0);
        }

        .popup strong {
            color: #0756b8;
        }

        .popup p {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: #0b1f3a;
            color: white;
        }

        footer p {
            font-size: 13px;
            margin: 5px;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .popup {
                left: 20px;
                right: 20px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     COLLEGE HEADER
========================= -->

<header>

    <div class="brand">

        <!-- COLLEGE LOGO -->
        <img
            src="../images/college-logo.jpg"
            alt="Vidya First Grade College Logo"
        >

        <div>
            <h1>Vidya First Grade College</h1>
            <p>Tumkur, Karnataka</p>
        </div>

    </div>

    <a href="dashboard.html" class="back">
        ← Back
    </a>

</header>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="container">

    <div class="card">

        <h2>📤 Share Your Notes</h2>

        <p class="description">
            Upload your academic notes for admin approval.
        </p>


        <form id="notesForm">

            <!-- NOTE TITLE -->

            <label for="title">
                Note Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Example: Computer Networks Notes"
                required
            >


            <!-- SEMESTER -->

            <label for="semester">
                Semester
            </label>

            <select id="semester" required>

                <option value="">
                    Select Semester
                </option>

                <option value="Semester 1">
                    Semester 1
                </option>

                <option value="Semester 2">
                    Semester 2
                </option>

                <option value="Semester 3">
                    Semester 3
                </option>

                <option value="Semester 4">
                    Semester 4
                </option>

                <option value="Semester 5">
                    Semester 5
                </option>

                <option value="Semester 6">
                    Semester 6
                </option>

            </select>


            <!-- SUBJECT -->

            <label for="subject">
                Subject
            </label>

            <input
                type="text"
                id="subject"
                placeholder="Example: Computer Networks"
                required
            >


            <!-- PDF FILE -->

            <label for="noteFile">
                Select Notes PDF
            </label>

            <input
                type="file"
                id="noteFile"
                accept="application/pdf,.pdf"
                required
            >

            <div
                id="fileName"
                class="file-name"
            >
                No PDF selected
            </div>


            <!-- UPLOAD -->

            <button
                type="submit"
                class="upload-button"
            >
                Upload Notes
            </button>

        </form>

    </div>

</main>


<!-- =========================
     POPUP
========================= -->

<div
    id="popup"
    class="popup"
>

    <strong id="popupTitle">
        Upload Successful
    </strong>

    <p id="popupMessage">
        Your note has been submitted for admin approval.
    </p>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 Vidya First Grade College, Tumkur
    </p>

    <p>
        Academic Notes Sharing and Management System
    </p>

</footer>


<script>

/* =========================================
   FILE SELECT
========================================= */

const fileInput =
    document.getElementById("noteFile");

const fileName =
    document.getElementById("fileName");


fileInput.addEventListener(
    "change",
    function () {

        if (fileInput.files.length > 0) {

            const file =
                fileInput.files[0];

            fileName.textContent =
                "Selected PDF: " + file.name;

        } else {

            fileName.textContent =
                "No PDF selected";

        }

    }
);


/* =========================================
   FORM SUBMISSION
========================================= */

document
    .getElementById("notesForm")
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const title =
                document.getElementById("title").value.trim();

            const semester =
                document.getElementById("semester").value;

            const subject =
                document.getElementById("subject").value.trim();

            const file =
                fileInput.files[0];


            /* CHECK FILE */

            if (!file) {

                alert("Please select a PDF file.");

                return;

            }


            /* ONLY PDF */

            if (file.type !== "application/pdf") {

                alert("Please select a PDF file only.");

                return;

            }


            /*
             ========================================
             READ THE ACTUAL PDF FILE
             ========================================
            */

            const reader =
                new FileReader();


            reader.onload = function () {

                /*
                 The actual PDF is stored here.
                 This is the important fix.
                */

                const note = {

                    id:
                        Date.now(),

                    title:
                        title,

                    semester:
                        semester,

                    subject:
                        subject,

                    fileName:
                        file.name,

                    fileType:
                        file.type,

                    fileData:
                        reader.result,

                    status:
                        "Pending",

                    approvalStatus:
                        "Pending",

                    approved:
                        false,

                    uploadedDate:
                        new Date().toLocaleString()

                };


                /*
                 ====================================
                 SAVE PENDING NOTE
                 ====================================
                */

                localStorage.setItem(
                    "noteHubPendingNote",
                    JSON.stringify(note)
                );


                /*
                 Also keep a list of submitted notes.
                */

                let pendingNotes =
                    JSON.parse(
                        localStorage.getItem(
                            "pendingNotes"
                        )
                    ) || [];


                pendingNotes.push(note);


                localStorage.setItem(
                    "pendingNotes",
                    JSON.stringify(pendingNotes)
                );


                /*
                 ====================================
                 SHOW SUCCESS POPUP
                 ====================================
                */

                document.getElementById(
                    "popupTitle"
                ).textContent =
                    "Upload Successful";


                document.getElementById(
                    "popupMessage"
                ).textContent =
                    "Your PDF has been submitted for admin approval.";


                document
                    .getElementById("popup")
                    .classList.add("show");


                /*
                 RESET FORM
                */

                document
                    .getElementById("notesForm")
                    .reset();


                fileName.textContent =
                    "No PDF selected";


                /*
                 HIDE POPUP
                */

                setTimeout(function () {

                    document
                        .getElementById("popup")
                        .classList.remove("show");

                }, 3000);

            };


            /*
             ========================================
             ERROR READING PDF
             ========================================
            */

            reader.onerror = function () {

                alert(
                    "The PDF could not be read. Please try again."
                );

            };


            /*
             ========================================
             READ PDF AS DATA URL
             ========================================
            */

            reader.readAsDataURL(file);

        }
    );

</script>

</body>
</html>
