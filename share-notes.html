<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Share Notes | NoteHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #0756b8, #1688e8);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 4px;
        }

        .brand h1 {
            font-size: 26px;
        }

        .brand p {
            font-size: 13px;
            margin-top: 4px;
        }

        .back {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        h2 {
            color: #0756b8;
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1688e8;
        }

        .upload-button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #0756b8, #1688e8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-button:hover {
            opacity: 0.9;
        }

        .file-name {
            margin-top: 8px;
            font-size: 13px;
            color: #64748b;
        }

        .popup {
            position: fixed;
            top: 25px;
            right: 25px;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
            border-left: 5px solid #168a5a;

            opacity: 0;
            transform: translateX(120%);
            transition: 0.4s;
        }

        .popup.show {
            opacity: 1;
            transform: translateX(0);
        }

        .popup strong {
            color: #0756b8;
        }

        .popup p {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: #0b1f3a;
            color: white;
        }

        footer p {
            font-size: 13px;
            margin: 5px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .popup {
                left: 20px;
                right: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">

        <img src="../college-logo.jpg" alt="College Logo">

        <div>
            <h1>NoteHub</h1>
            <p>Share Notes</p>
        </div>

    </div>

    <a href="notes.html" class="back">
        ← Back
    </a>

</header>


<main class="container">

    <div class="card">

        <h2>📤 Share Your Notes</h2>

        <p class="description">
            Upload your notes for admin approval.
        </p>


        <form id="notesForm">

            <label for="title">
                Note Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Example: C Programming Notes"
                required
            >


            <label for="semester">
                Semester
            </label>

            <select id="semester" required>

                <option value="">
                    Select Semester
                </option>

                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
                <option>Semester 5</option>
                <option>Semester 6</option>

            </select>


            <label for="subject">
                Subject
            </label>

            <input
                type="text"
                id="subject"
                placeholder="Example: Computer Networks"
                required
            >


            <label for="noteFile">
                Select Notes File
            </label>

            <input
                type="file"
                id="noteFile"
                accept=".pdf,.doc,.docx"
                required
            >

            <div
                id="fileName"
                class="file-name"
            >
                No file selected
            </div>


            <button
                type="submit"
                class="upload-button"
            >
                Upload Notes
            </button>

        </form>

    </div>

</main>


<div
    id="popup"
    class="popup"
>

    <strong>
        Upload Successful
    </strong>

    <p>
        Your note has been submitted for admin approval.
    </p>

</div>


<footer>

    <p>
        © 2026 NoteHub — BCA Note Sharing System
    </p>

</footer>


<script>

    const fileInput =
        document.getElementById("noteFile");

    const fileName =
        document.getElementById("fileName");


    fileInput.addEventListener(
        "change",
        function () {

            if (fileInput.files.length > 0) {

                fileName.textContent =
                    "Selected: " +
                    fileInput.files[0].name;

            } else {

                fileName.textContent =
                    "No file selected";

            }

        }
    );


    document
        .getElementById("notesForm")
        .addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const title =
                    document.getElementById("title").value;

                const semester =
                    document.getElementById("semester").value;

                const subject =
                    document.getElementById("subject").value;

                const file =
                    fileInput.files[0];


                if (!file) {
                    alert("Please select a notes file.");
                    return;
                }


                const note = {

                    title: title,

                    semester: semester,

                    subject: subject,

                    fileName: file.name,

                    status: "Pending"

                };


                localStorage.setItem(
                    "noteHubPendingNote",
                    JSON.stringify(note)
                );


                document
                    .getElementById("popup")
                    .classList.add("show");


                document
                    .getElementById("notesForm")
                    .reset();


                fileName.textContent =
                    "No file selected";


                setTimeout(function () {

                    document
                        .getElementById("popup")
                        .classList.remove("show");

                }, 2500);

            }
        );

</script>

</body>
</html>
